name: Deploy to AWS

# Deploys the SPA bundle to the bucket that actually serves runsitself.co and
# maciejmarek.com. Both domains are aliases on one CloudFront distribution and
# share one index.html; the app splits them at runtime on window.location.hostname.
#
# Production only, deliberately. This used to also fire on feat/temultuous, which
# was harmless while it pointed at an orphan distribution. It no longer is.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws-tech-signature
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  S3_BUCKET: business-sites-static-116584140121
  CLOUDFRONT_DISTRIBUTION_ID: E33B8H8Q47V73Y
  VITE_TEMULTUOUS_API_URL: https://cj4ggtule7dbuzwvvbt6nsgbdq0jlekg.lambda-url.eu-central-1.on.aws

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::116584140121:role/github-deploy-tech-signature
          aws-region: ${{ env.AWS_REGION }}

      # NEVER add --delete here. This bucket holds ~600 objects that are not built
      # from this repo: US refrigeration opportunity-map pages, amzflow, dashboard,
      # preview, tiktokflow. A mirroring sync would erase all of them.
      # The IAM role has no s3:DeleteObject and is scoped to index.html + assets/*,
      # so a --delete added here fails rather than destroys. Keep it that way.
      - name: Upload hashed assets
        run: |
          aws s3 sync dist/assets "s3://${S3_BUCKET}/assets" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
